baseURL = "https://pratiksethi.dev/"
languageCode = "en-us"
title = "Pratik Sethi"
theme = "PaperMod"

# URL structure: /posts/<slug>/
[permalinks]
  posts = "/posts/:slug/"

# Disable taxonomies (no tags)
[taxonomies]

# PaperMod theme parameters
[params]
  author = "Pratik Sethi"
  description = "Software engineer sharing learnings and thoughts"
  
  # Avatar image
  images = ["/images/avatar.jpg"]
  
  # Show recent posts on homepage
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  
  # Homepage mode - profile with recent posts
  [params.homeInfoParams]
    Title = "Pratik Sethi"
    Content = "Software Engineer"
  
  # Using custom homepage layout instead of profileMode
  [params.profileMode]
    enabled = false
  
  # Social icons
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/pratiksethi"
  
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/pratik-sethi"
  
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/sethi_pratik"

# Navigation menu
[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3
